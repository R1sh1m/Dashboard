name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # electron-builder NSIS packaging requires Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (clean, reproducible)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build web app (tsc -b && vite build)
        run: npm run build

      # electron-builder may rebuild native modules (e.g. serialport) against
      # Electron's ABI. Point node-gyp at the Visual Studio 2022 toolchain
      # that is pre-installed on windows-latest via the npm_config_msvs_version
      # env var (node-gyp reads it from npm config). `npm config set` is not
      # valid for this key in npm 11+, so we set it as an env var instead.
      - name: Configure MSBuild toolset (2022) for native module rebuilds
        run: echo "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Build Electron installer (NSIS)
        run: npm run electron:build
        # No code-signing certificate is configured, so electron-builder
        # produces an unsigned installer. Signing is intentionally omitted.

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-ground-station-installer
          path: release/*.exe
          retention-days: 30

      - name: Create GitHub Release with installer
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          tag_name: v${{ github.run_number }}
          name: Artemis Ground Station v${{ github.run_number }}
          body: |
            One-click installer for the Artemis Ground Station Dashboard.
            
            ## What's included
            - React dashboard + Express/WebSocket bridge server
            - Electron runtime (desktop window)
            - Silicon Labs CP210x USB-to-UART driver (installed on first run)
            - Windows Firewall rule for port 3001 (LAN streaming)
            
            ## First-run setup
            1. Plug the ESP32 ground bridge into your laptop's USB port
            2. Run the installer
            3. Complete the setup wizard (API keys, drivers, firewall, serial port)
            4. Dashboard launches — connection toast shows local + LAN URLs
            
            ## Access from other devices
            http://<laptop-wifi-ip>:3001
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
